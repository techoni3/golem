  <script>
    // Apply the saved appearance before CSS is requested so reloads never
    // Apply a saved non-default theme before CSS is requested. Dark remains
    // the default when the preference is missing or not recognized.
    (() => {
      try {
        const theme = localStorage.getItem('golem.tweaks.theme');
        if (['loam', 'graphite', 'nocturne'].includes(theme)) {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    })();
  </script>
