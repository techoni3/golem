<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
<defs>
  <style>
    .core { fill: #D97757; transform-origin: 50px 50px; animation: cl-core 2.4s ease-in-out infinite; }
    .spoke { stroke: #D97757; stroke-linecap: round; transform-origin: 50px 50px; }
    .s1  { animation: cl-spk-1  1.7s ease-in-out infinite; }
    .s2  { animation: cl-spk-2  2.2s ease-in-out infinite; }
    .s3  { animation: cl-spk-3  1.5s ease-in-out infinite; }
    .s4  { animation: cl-spk-4  1.9s ease-in-out infinite; }
    .s5  { animation: cl-spk-5  2.5s ease-in-out infinite; }
    .s6  { animation: cl-spk-6  1.6s ease-in-out infinite; }
    .s7  { animation: cl-spk-7  2.1s ease-in-out infinite; }
    .s8  { animation: cl-spk-8  1.5s ease-in-out infinite; }
    .s9  { animation: cl-spk-9  2.3s ease-in-out infinite; }
    .s10 { animation: cl-spk-10 1.8s ease-in-out infinite; }
    .s11 { animation: cl-spk-11 2.0s ease-in-out infinite; }
    @keyframes cl-spk-1 { 0%,100%{transform:scaleY(0.70)} 45%{transform:scaleY(1.15)} }
    @keyframes cl-spk-2 { 0%,100%{transform:scaleY(1.18)} 55%{transform:scaleY(0.60)} }
    @keyframes cl-spk-3 { 0%,100%{transform:scaleY(0.55)} 40%{transform:scaleY(1.22)} 75%{transform:scaleY(0.85)} }
    @keyframes cl-spk-4 { 0%,100%{transform:scaleY(1.05)} 35%{transform:scaleY(0.50)} 70%{transform:scaleY(1.20)} }
    @keyframes cl-spk-5 { 0%,100%{transform:scaleY(0.65)} 50%{transform:scaleY(1.15)} }
    @keyframes cl-spk-6 { 0%,100%{transform:scaleY(1.12)} 40%{transform:scaleY(0.58)} }
    @keyframes cl-spk-7 { 0%,100%{transform:scaleY(0.75)} 30%{transform:scaleY(1.25)} 65%{transform:scaleY(0.60)} }
    @keyframes cl-spk-8 { 0%,100%{transform:scaleY(1.20)} 60%{transform:scaleY(0.52)} }
    @keyframes cl-spk-9 { 0%,100%{transform:scaleY(0.58)} 45%{transform:scaleY(1.10)} }
    @keyframes cl-spk-10{ 0%,100%{transform:scaleY(1.15)} 50%{transform:scaleY(0.68)} }
    @keyframes cl-spk-11{ 0%,100%{transform:scaleY(0.62)} 40%{transform:scaleY(1.20)} 80%{transform:scaleY(0.82)} }
    @keyframes cl-core  { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08);fill:#E68466} }
  </style>
</defs>
<circle class="core" cx="50" cy="50" r="14" />
<g transform="rotate(0 50 50)"><line class="spoke s1" x1="50" y1="50" x2="50" y2="12" stroke-width="11"/></g>
<g transform="rotate(33 50 50)"><line class="spoke s2" x1="50" y1="50" x2="50" y2="12" stroke-width="12"/></g>
<g transform="rotate(65 50 50)"><line class="spoke s3" x1="50" y1="50" x2="50" y2="16" stroke-width="9.5"/></g>
<g transform="rotate(98 50 50)"><line class="spoke s4" x1="50" y1="50" x2="50" y2="12" stroke-width="11"/></g>
<g transform="rotate(130 50 50)"><line class="spoke s5" x1="50" y1="50" x2="50" y2="12" stroke-width="12"/></g>
<g transform="rotate(160 50 50)"><line class="spoke s6" x1="50" y1="50" x2="50" y2="16" stroke-width="9.5"/></g>
<g transform="rotate(195 50 50)"><line class="spoke s7" x1="50" y1="50" x2="50" y2="13" stroke-width="11"/></g>
<g transform="rotate(228 50 50)"><line class="spoke s8" x1="50" y1="50" x2="50" y2="12" stroke-width="12"/></g>
<g transform="rotate(260 50 50)"><line class="spoke s9" x1="50" y1="50" x2="50" y2="15" stroke-width="10"/></g>
<g transform="rotate(295 50 50)"><line class="spoke s10" x1="50" y1="50" x2="50" y2="13" stroke-width="11"/></g>
<g transform="rotate(328 50 50)"><line class="spoke s11" x1="50" y1="50" x2="50" y2="12" stroke-width="12"/></g>
</svg>