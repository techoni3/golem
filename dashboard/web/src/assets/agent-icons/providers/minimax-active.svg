<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
<defs>
  <style>
    .mm-wave { transform-origin: 12px 12px; animation: mm-bounce 1.6s ease-in-out infinite alternate; }
    .mm-aura { transform-origin: 12px 12px; animation: mm-glow 1.6s ease-in-out infinite alternate; }
    @keyframes mm-bounce { 0%{transform:scaleY(0.85) scaleX(0.96)} 50%{transform:scaleY(1.14) scaleX(1.04)} 100%{transform:scaleY(0.92) scaleX(0.98)} }
    @keyframes mm-glow { 0%{opacity:0.25;transform:scale(0.8)} 100%{opacity:0.7;transform:scale(1.25)} }
  </style>
  <linearGradient id="mmGradAnim" x1="0%" x2="100%" y1="50%" y2="50%">
    <stop offset="0%" stop-color="#E2167E"/>
    <stop offset="100%" stop-color="#FE603C"/>
  </linearGradient>
  <radialGradient id="mmGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FE603C" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#E2167E" stop-opacity="0"/>
  </radialGradient>
</defs>
<circle class="mm-aura" cx="12" cy="12" r="10" fill="url(#mmGlow)" />
