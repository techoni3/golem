<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor">
<defs>
  <style>
    .oc-outer { transform-origin: 12px 12px; animation: oc-frame 2.2s ease-in-out infinite alternate; color: #10B981; }
    .oc-inner { transform-origin: 12px 12px; animation: oc-blink 0.9s step-end infinite; color: #34D399; }
    @keyframes oc-frame { 0%{transform:scale(0.94)} 100%{transform:scale(1.06)} }
    @keyframes oc-blink { 0%, 100%{opacity:1} 50%{opacity:0.15} }
  </style>
</defs>
<g>
  <path class="oc-outer" fill-rule="evenodd" d="M20 22H4V2h16v20zm-2-2V4H6v16h12z"/>
  <path class="oc-inner" d="M16 6H8v12h8V6z"/>
</g>
</svg>