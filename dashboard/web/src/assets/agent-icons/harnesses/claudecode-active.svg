<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
<defs>
  <style>
    .cc-typing-body { transform-origin: 12px 14px; animation: cc-type-bob 0.2s ease-in-out infinite alternate; fill: #D97757; }
    .cc-hand-l { transform-origin: 2px 12px; animation: cc-hand-l-tap 0.15s ease-in-out infinite alternate; fill: #FFA285; }
    .cc-hand-r { transform-origin: 22px 12px; animation: cc-hand-r-tap 0.15s ease-in-out infinite alternate 0.07s; fill: #FFA285; }
    .code-spark { animation: spark-float 0.7s ease-out infinite; }
    @keyframes cc-type-bob { 0%{transform:translateY(0)} 100%{transform:translateY(-0.8px)} }
    @keyframes cc-hand-l-tap { 0%{transform:translateY(-1.5px) rotate(-8deg)} 100%{transform:translateY(1.5px) rotate(8deg)} }
    @keyframes cc-hand-r-tap { 0%{transform:translateY(1.5px) rotate(8deg)} 100%{transform:translateY(-1.5px) rotate(-8deg)} }
    @keyframes spark-float { 0%{transform:translateY(18px);opacity:1} 100%{transform:translateY(8px);opacity:0} }
  </style>
</defs>
