name: Bug report
description: Report a reproducible Golem problem
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Golem, Node.js, OS, and harness versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Sanitized steps, expected behavior, and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, journals, databases, tokens, and private paths.
          required: true
